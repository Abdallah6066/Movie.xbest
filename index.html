<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>▶️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .player {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 16/9;
            background: #111;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .yt-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 68px;
            height: 48px;
            background: rgba(255,0,0,0.9);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .yt-play::after {
            content: '▶';
            color: #fff;
            font-size: 24px;
            margin-left: 4px;
        }
        .error {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="player">
        <img id="target" src="" alt="">
        <div class="yt-play"></div>
        <div class="error">Video unavailable in your region<br>Click anywhere to watch on external site</div>
    </div>

    <script>
        const img = new URLSearchParams(window.location.search).get('img');
        if(img) document.getElementById('target').src = decodeURIComponent(img);
        
        // Redirect to offer after click or 3s delay
        document.body.addEventListener('click', () => {
             // window.location.href = 'https://your-offer.com';
        });
    </script>
</body>
</html>
